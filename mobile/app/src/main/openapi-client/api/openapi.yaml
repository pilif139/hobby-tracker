          description: Added
        "404":
          content:
            application/json:
              example:
                message: Not Found
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Not Found
        "409":
          content:
            application/json:
              example:
                message: Conflict
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Conflict
