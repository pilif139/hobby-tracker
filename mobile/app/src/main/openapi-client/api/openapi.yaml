        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                properties: {}
                type: object
          description: Hobby
        "404":
          content:
            application/json:
              example:
                message: Not Found
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
