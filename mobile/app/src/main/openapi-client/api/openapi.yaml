openapi: 3.1.0
info:
  description: Development documentation
  title: Hono Documentation
  version: 0.0.0
servers:
- url: /
security:
- accessTokenCookie: []
  refreshTokenCookie: []
paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postAuthLogin_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogin_200_response"
          description: Successfully logged in
          headers:
            Set-Cookie:
              explode: false
              schema:
                nullable: true
                type: string
              style: simple
        "401":
          content:
            application/json:
              example:
                message: Credentials are invalid
              schema:
                $ref: "#/components/schemas/postAuthLogin_401_response"
          description: Unauthorized
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/register:
    post:
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postAuthRegister_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogin_200_response"
          description: Successfully registered user
          headers:
            Set-Cookie:
              explode: false
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              example:
                message: Forbidden
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                message: Internal server error
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Internal Server Error
      tags:
      - Authentication
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/me:
    get:
      operationId: getAuthMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogin_200_response"
          description: Current authenticated user
        "404":
          content:
            application/json:
              example:
                message: Not Found
              schema:
                $ref: "#/components/schemas/getAuthMe_404_response"
          description: Not Found
      tags:
      - Authentication
      x-accepts:
      - application/json
  /auth/logout:
    post:
      operationId: postAuthLogout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Success
      tags:
      - Authentication
      x-accepts:
      - application/json
  /auth/logout-other-devices:
    post:
      operationId: postAuthLogoutOtherDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Success
        "400":
          content:
            application/json:
              example:
                message: Bad request
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Bad Request
      tags:
      - Authentication
      x-accepts:
      - application/json
  /user/{id}:
    get:
      operationId: getUserById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getUserById_200_response"
          description: User Profile
        "404":
          content:
            application/json:
              example:
                message: Not Found
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Not Found
      tags:
      - User
      x-accepts:
      - application/json
  /user/me:
    delete:
      operationId: deleteUserMe
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              example:
                message: Not Found
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Not Found
      tags:
      - User
      x-accepts:
      - application/json
    patch:
      operationId: patchUserMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/patchUserMe_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogin_200_response"
          description: Updated User
      tags:
      - User
      x-content-type: application/json
      x-accepts:
      - application/json
  /user/avatar:
    post:
      operationId: postUserAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/postUserAvatar_request"
        required: true
      responses:
        "200":
          description: Avatar uploaded successfully
        "400":
          content:
            application/json:
              example:
                message: Bad request
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Bad Request
        "413":
          content:
            application/json:
              example:
                message: Content too large
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Content Too Large
        "500":
          content:
            application/json:
              example:
                message: Internal server error
              schema:
                $ref: "#/components/schemas/postAuthRegister_403_response"
          description: Internal Server Error
      tags:
      - User
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /hobby:
    get:
      operationId: getHobby
      parameters:
      - explode: true
        in: query
        name: search
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties: {}
                  type: object
                type: array
          description: Search Results
      tags:
      - Hobby
      x-accepts:
      - application/json
    post:
      operationId: postHobby
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/postHobby_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties: {}
                type: object
          description: Created Hobby
      tags:
      - Hobby
      x-content-type: application/json
      x-accepts:
      - application/json
  /hobby/user/{userId}:
    get:
      operationId: getHobbyUserByUserId
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          nullable: true
          type: string
        style: simple
      responses:
        "200":
