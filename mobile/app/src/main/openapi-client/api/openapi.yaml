      parameters:
      - explode: false
        in: path
        name: hobbyId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Removed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAuthLogout_200_response"
